<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ma page photo personnelle.">
  <title>Ma photo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 16px; background: #10131b; color: #f7f7fb;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main { width: min(920px, 100%); text-align: center; }
    h1 { margin: 0 0 18px; font-size: clamp(1.6rem, 5vw, 2.5rem); }
    img {
      display: block; width: 100%; max-height: 78vh; object-fit: contain;
      border-radius: 18px; box-shadow: 0 16px 50px #0008;
      background: #242936;
    }
    p { color: #c4c9d4; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Ma photo</h1>
    <img src="assets/photo.jpg" alt="Photo personnelle">
    <p>Bienvenue sur ma page.</p>
  </main>
</body>
</html>
